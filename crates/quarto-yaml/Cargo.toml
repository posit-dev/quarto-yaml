[package]
name = "quarto-yaml"
description = "A YAML 1.2 parser that preserves fine-grained source locations (byte ranges) for every node."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["yaml", "parser", "source-map", "spans", "diagnostics"]
categories = ["parsing", "development-tools"]

[features]
# Off by default. Turns the content-provenance walker's desync response from
# a silent `None` into a panic, and asserts that every scalar whose
# derivation ran produced `Some` — the runtime check that replaces the
# compiler enforcement the additive (non-breaking) provenance design gave
# up. See the asserts next to `Event::Scalar` in `parser.rs` for what is and
# isn't proven by them.
strict-provenance = []

[dependencies]
saphyr-parser = { workspace = true }
yaml-rust2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
quarto-source-map = { workspace = true }

[dev-dependencies]
regex = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "memory_overhead"
harness = false

[[bench]]
name = "scaling_overhead"
harness = false

[lints]
workspace = true
